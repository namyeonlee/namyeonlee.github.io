<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Writing | Namyeon Lee</title>

  <meta
    name="description"
    content="Writing - Namyeon Lee, Assistant Professor of Public Relations at UNC Pembroke"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" href="img/favicon.ico" />

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #222222;
      --accent-color: #000000;
      --link-color: #0066cc;
      --link-hover: #0b5bd3;
      --border-color: #dddddd;
      --muted: #777777;
      --card-bg: #fafafa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1a1a1a;
        --text-color: #eeeeee;
        --accent-color: #ffffff;
        --link-color: #8ab4f8;
        --link-hover: #aecbfa;
        --border-color: #444444;
        --muted: #aaaaaa;
        --card-bg: #222222;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem 1rem;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin: .2rem 0 1.5rem;
      font-weight: 600;
    }

    a {
      color: var(--link-color);
      text-decoration: none;
    }

    a:hover,
    a:focus {
      color: var(--link-hover);
      text-decoration: underline;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .5rem;
    }

    .links a {
      padding: .35rem .6rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-weight: 500;
      transition: background-color .2s ease;
    }

    .links a:hover {
      background-color: var(--border-color);
    }

    .page-content {
      max-width: 520px;
      width: 100%;
      margin: 2rem auto 0;
      text-align: left;
      line-height: 1.6;
      font-size: .95rem;
    }

    .card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      background-color: var(--card-bg);
    }

    .card p {
      margin: 0 0 .9rem;
    }

    .card p:last-child {
      margin-bottom: 0;
    }

    .tmi {
      margin-top: 1.4rem;
      font-size: .9rem;
      color: var(--muted);
      text-align: center;
    }

    footer {
      margin-top: 1.5rem;
      font-size: .85rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      .page-content {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Writing</h1>

    <nav class="links" aria-label="Primary">

      <a href="index.html">Home</a>

      <a href="Namyeon_Lee_CV.pdf" target="_blank" rel="noopener">
        CV
      </a>

      <a href="teaching.html">Teaching</a>

      <a href="research.html">Research</a>

      <a
        href="https://scholar.google.com/citations?user=e9AxEE4AAAAJ&hl=en"
        target="_blank"
        rel="noopener"
      >
        Google Scholar
      </a>

      <a href="writing.html">Writing</a>

    </nav>

    <section class="page-content">

      <div class="card">

        <p>
          Outside of academic writing, I occasionally write about everyday life and things I want to remember.
          Most of it is in Korean.
        </p>

        <p>
          <a
            href="https://honeycrisps.tistory.com/"
            target="_blank"
            rel="noopener"
          >
            Read my blog →
          </a>
        </p>

      </div>

    </section>

    <div class="tmi">🍅</div>

    <footer>
      &copy; <span id="year"></span> Namyeon Lee
    </footer>

  </main>

  <script>
    document.getElementById('year').textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
